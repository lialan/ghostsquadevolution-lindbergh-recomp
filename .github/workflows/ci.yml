name: ci
on:
  push:
    branches: [main, macos-port]
  pull_request:
    branches: [main, macos-port]

jobs:
  build:
    # CI has no game, so this configures without lifted code. The CMake then
    # builds the toolkit's self-check against this repo's pinned submodule,
    # which proves the pin builds. The game itself is built on netlab.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake -S . -B build -A Win32
      - run: cmake --build build --config Release
      - run: build/lindberghrecomp/Release/lindbergh_rt_selftest.exe

  macos:
    # The same self-check through the POSIX/SDL2 host, which needs no game.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: brew install ninja sdl2
      - run: cmake -S . -B build-mac -G Ninja
      - run: cmake --build build-mac
      - run: build-mac/lindberghrecomp/lindbergh_rt_selftest
