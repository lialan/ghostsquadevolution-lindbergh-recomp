# Ghost Squad Evolution (Sega, 2007): what scripts/ and quest/ need to know
# about this game. Sourced by sh and bash; keep it plain assignments and
# functions.

TITLE="Ghost Squad Evolution"
FOLDER_HINT="/path/to/vsg_l"            # what the player gives the scripts

# The game's folder is vsg_l: the executable (an ELF with no extension) and
# the two sound libraries the game dlopens. A disc root holding vsg_l/ or
# disk1/vsg_l/ is fine too.
ELF=vsg                                 # the executable, inside the folder
find_game() {
    for d in "$1" "$1/vsg_l" "$1/disk1/vsg_l"; do
        [ -f "$d/vsg" ] && { (cd "$d" && pwd); return; }
    done
}
# lifted beside the game: the sound libraries, in this order (it fixes where
# each lands in guest memory)
SOLIBS="librnalindbergh_jr.so snd_util.so"

# The Quest app
APP="Ghost Squad Evolution VR"
APK=GhostSquadEvolutionVR               # quest/$APK.apk
PKG=org.lindbergh.gse.vr
ACTIVITY=org.lindbergh.gse.GhostSquadVR
SHA_FILE=vsg.sha256                     # in generated/: the SHA-256 of the executable
HEADSET_DIR=/sdcard/GhostSquadEvolution # the game is copied to $HEADSET_DIR/vsg_l
HEADSET_SUB=vsg_l
GAME_PARTS=.                            # what of the folder is copied: all of it
ASSET_DIR=vsg_l                         # where a --with-game APK carries it
LOG=gse.log
SIZE="about 560 MB"
