# The House of the Dead 4 (Sega, 2005): what scripts/ and quest/ need to know
# about this game. Sourced by sh and bash; keep it plain assignments and
# functions.

TITLE="The House of the Dead 4"
FOLDER_HINT="/path/to/House of the Dead 4"  # what the player gives the scripts

# The game's folder holds elf/ (the executable, hod4M.elf, which runs from
# there), fs/ (the data) and drv/.
ELF=elf/hod4M.elf                       # the executable, inside the folder
find_game() {
    for d in "$1" "$1/House of the Dead 4"; do
        [ -f "$d/elf/hod4M.elf" ] && { (cd "$d" && pwd); return; }
    done
}
SOLIBS=""                               # it loads no libraries of its own

# The Quest app
APP="The House of the Dead 4 VR"
APK=HouseOfTheDead4VR                   # quest/$APK.apk
PKG=org.lindbergh.hotd4.vr
ACTIVITY=org.lindbergh.hotd4.HouseOfTheDead4VR
SHA_FILE=hod4M.elf.sha256               # in generated/: the SHA-256 of the executable
HEADSET_DIR=/sdcard/HouseOfTheDead4     # the game is copied to $HEADSET_DIR (elf, fs, drv)
HEADSET_SUB=
GAME_PARTS="elf fs drv"                 # what of the folder is copied
ASSET_DIR=game                          # where a --with-game APK carries it
LOG=hotd4.log
SIZE="about 2.8 GB"
