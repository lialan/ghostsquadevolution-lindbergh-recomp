# The House of the Dead 4 Special (Sega, 2006): what scripts/ and quest/ need
# to know about this game. Sourced by sh and bash; keep it plain assignments
# and functions.

TITLE="The House of the Dead 4 Special"
FOLDER_HINT="/path/to/hotd4sp"          # what the player gives the scripts

# The game's folder holds elf/ (the executable, hod4M.elf, which runs from
# there) and fs/ (the data).
ELF=elf/hod4M.elf                       # the executable, inside the folder
find_game() {
    for d in "$1" "$1/hotd4sp"; do
        [ -f "$d/elf/hod4M.elf" ] && [ -d "$d/fs/sfd" ] && { (cd "$d" && pwd); return; }
    done
}
SOLIBS=""                               # it loads no libraries of its own
STRIPPED=1                              # no symbol table: tools bounds finds its functions

# The Quest app
APP="The House of the Dead 4 Special VR"
APK=HouseOfTheDead4SpecialVR            # quest/$APK.apk
PKG=org.lindbergh.hotd4sp.vr
ACTIVITY=org.lindbergh.hotd4sp.HouseOfTheDead4SpecialVR
SHA_FILE=hod4M.elf.sha256               # in generated/: the SHA-256 of the executable
HEADSET_DIR=/sdcard/HouseOfTheDead4Special
HEADSET_SUB=
GAME_PARTS="elf fs"                     # what of the folder is copied
ASSET_DIR=game                          # where a --with-game APK carries it
LOG=hotd4sp.log
SIZE="about 1.8 GB"
