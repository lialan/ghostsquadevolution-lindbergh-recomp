# Let's Go Jungle! Lost on the Island of Spice (Sega, 2006): what scripts/
# and quest/ need to know about this game. Sourced by sh and bash; keep it
# plain assignments and functions.

TITLE="Let's Go Jungle!"
FOLDER_HINT="/path/to/Let's Go Jungle"  # what the player gives the scripts

# The game's folder holds the executable, lgj_final (an ELF with no
# extension), beside its data/ and shader/ folders and the libraries it links.
ELF=lgj_final                           # the executable, inside the folder
find_game() {
    for d in "$1" "$1"/*/; do
        [ -f "$d/lgj_final" ] && { (cd "$d" && pwd); return; }
    done
}
SOLIBS=""                               # lifted beside the game, in this order

# The Quest app
APP="Let's Go Jungle VR"
APK=LetsGoJungleVR                      # quest/$APK.apk
PKG=org.lindbergh.lgj.vr
ACTIVITY=org.lindbergh.lgj.LetsGoJungleVR
SHA_FILE=lgj_final.sha256               # in generated/: the SHA-256 of the executable
HEADSET_DIR=/sdcard/LetsGoJungle        # the game is copied to $HEADSET_DIR
HEADSET_SUB=
GAME_PARTS="lgj_final data shader extraShader"  # what of the folder is copied
ASSET_DIR=game                          # where a --with-game APK carries it
LOG=lgj.log
SIZE="about 1 GB"
