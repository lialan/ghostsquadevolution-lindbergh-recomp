apply plugin: 'com.android.application'

// Ghost Squad Evolution VR for Meta Quest. quest/build.sh fills src/main/libs
// and the SDL Java sources before this runs.
android {
    namespace "org.lindbergh.gse"
    compileSdkVersion 35

    defaultConfig {
        applicationId "org.lindbergh.gse.vr"
        minSdkVersion 29
        targetSdkVersion 32
        versionCode 1
        versionName "0.1.0"
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lintOptions { abortOnError false }

    sourceSets.main {
        jni.srcDirs = []
        jniLibs.srcDir 'src/main/libs'
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    signingConfigs {
        // sideloading: the local debug key is fine; keep the same key to update in place
        release {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
